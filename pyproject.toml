[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "aplicaciones/automatizacion",
  "osiris_dev/views.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
