[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "aplicaciones/automatizacion",
  "osiris_dev/views.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
"aplicaciones/dashboard/vladimir_analytics.py" = ["E501"]
"aplicaciones/dashboard/test_vladimir_analytics.py" = ["E501"]
"aplicaciones/dashboard/relationship_detail.py" = ["E501", "I001"]
"aplicaciones/dashboard/relationship_diagnostics.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
